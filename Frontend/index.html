<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CafeCol CloudApp</title>
</head>
<body>

<h1>CafeCol CloudApp</h1>

<label>Nombre del cliente:</label>
<input type="text" id="cliente">

<br><br>

<label>Tipo de café:</label>
<select id="cafe">
    <option>Capuccino</option>
    <option>Latte</option>
    <option>Americano</option>
    <option>Espresso</option>
</select>

<br><br>

<button onclick="registrarPedido()">
    Registrar Pedido
</button>

<p id="resultado"></p>

<script>

async function registrarPedido() {

    const cliente =
        document.getElementById("cliente").value;

    const cafe =
        document.getElementById("cafe").value;

    const respuesta = await fetch(
        "https://xbs1q2mofl.execute-api.us-east-1.amazonaws.com/prod/pedido",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                cliente: cliente,
                cafe: cafe
            })
        }
    );

    const datos = await respuesta.json();

    document.getElementById("resultado").innerHTML =
        JSON.stringify(datos);
}

</script>

</body>
</html>
